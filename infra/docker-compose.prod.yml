# Prod: Caddy, app и Postgres 18 (ТД §12, ADR-0007). Запуск на сервере из /srv/studhub:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Секреты лежат в .env рядом с файлом, права 600 (см. .env.prod.example).
name: studhub

# Ротация логов Docker: 10 файлов по 50 МБ (ТД §12 «Наблюдение»).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Единственные порты, опубликованные наружу. Docker обходит ufw для опубликованных портов,
    # поэтому другие сервисы порты не публикуют.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-studhub.ru}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Образ приложения собирает и публикует SH-011. До этого сервис не запускается:
  # профиль `app` выключен по умолчанию. SH-011 убирает профиль.
  app:
    image: ghcr.io/nekomant/studhub:${APP_TAG:-latest}
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-studhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studhub}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:18
    restart: unless-stopped
    # Порт наружу не публикуется: приложение ходит по внутренней сети compose.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-studhub}
    # Postgres 18 хранит данные в подпапке версии, поэтому монтируем родительскую папку.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
