# Prod: Caddy, app и Postgres 18 (ТД §12, ADR-0007). Выкладку делает `./deploy.sh <тег>` на сервере из /srv/studhub.
# Вручную: docker compose -f docker-compose.prod.yml --env-file .env up -d
# Секреты лежат в .env рядом с файлом, права 600 (см. .env.prod.example).
name: studhub

# Ротация логов Docker: 10 файлов по 50 МБ (ТД §12 «Наблюдение»).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Единственные порты, опубликованные наружу. Docker обходит ufw для опубликованных портов,
    # поэтому другие сервисы порты не публикуют.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-studshub.ru}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Образ собирает и публикует CI (SH-011), тег задаёт deploy.sh. Порты не публикуются: Caddy ходит по сети compose.
  app:
    image: ghcr.io/nekomant/studhub:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-studhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studhub}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:18
    restart: unless-stopped
    # Порт наружу не публикуется: приложение ходит по внутренней сети compose.
    # Непрерывная архивация WAL в S3 другого провайдера через wal-g (SH-012, ТД §12 «Бэкапы»).
    # archive_timeout: простой сервер всё равно отправляет WAL не реже раза в 5 минут.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/opt/walg/wal-g wal-push %p
      - -c
      - archive_timeout=300
    # .env.backup: WALG_*, AWS_*, TELEGRAM_* (шаблон .env.backup.example, права 600). Контейнер app этот файл не читает.
    # Без файла compose не запускает ни один сервис, поэтому выкладка без настройки бэкапов падает до изменений.
    # Ключ шифрования: 64 шестнадцатеричных символа (`openssl rand -hex 32`). Потеряешь ключ, бэкапы не прочитать.
    env_file: .env.backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-studhub}
      # Постоянные настройки wal-g. Адрес бакета, ключи доступа и ключ шифрования лежат в .env.backup (env_file выше).
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      WALG_COMPRESSION_METHOD: zstd
      PGUSER: ${POSTGRES_USER:-studhub}
      PGDATABASE: ${POSTGRES_DB:-studhub}
    # Postgres 18 хранит данные в подпапке версии, поэтому монтируем родительскую папку.
    # ./bin/wal-g кладёт backup/install.sh; папку монтируем целиком, чтобы Docker не создал вместо файла каталог.
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./bin:/opt/walg:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
