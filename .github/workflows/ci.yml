# Проверки на каждый PR и push в main (ТД §12, docs/process.md §9).
# Обязательная проверка для защиты main — задача `checks`.
# Шаги после установки выполняются, даже если предыдущая проверка упала: в одном прогоне видны все ошибки.
# Новые проверки добавляют задачи, которые их создают.
# Job image собирает образ на каждый PR и публикует его в GHCR по слиянию в main. Job deploy выкладывает образ в prod (SH-011).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Тестовая БД только для этого прогона. Пароль не секрет: контейнер живёт до конца задачи.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: studhub
          POSTGRES_PASSWORD: change-me-local
          POSTGRES_DB: studhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studhub -d studhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://studhub:change-me-local@localhost:5432/studhub_test
    steps:
      - uses: actions/checkout@v5

      # Версию pnpm берёт из поля packageManager в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        id: install
        run: pnpm install --frozen-lockfile

      - name: Biome и tsc
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Сборка админки платформы
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @studhub/admin build

      - name: Миграции соответствуют схеме
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm db:check

      - name: Клиент OpenAPI актуален
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm gen:client:check

      - name: Критерии приёмки покрыты тестами
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ac:check

      # Только на PR: проверяет спецификации задач в Ready, чьи файлы изменил PR (docs/process.md §5).
      # actions/checkout берёт один коммит, поэтому шаг сам получает origin/main для сравнения.
      - name: Спецификации задач в Ready
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          node scripts/check-spec.mjs --changed

      # Браузерный тест темы (SH-073) и E2E (SH-008) запускают Chromium из Playwright.
      # Кэш браузеров привязан к lockfile: версия Playwright лежит в нём, новая версия сбрасывает кэш.
      - name: Кэш браузеров Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium для Playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @studhub/ui-tokens exec playwright install --with-deps chromium

      # Харнесс сам создаёт БД рядом с TEST_DATABASE_URL, применяет миграции и запускает приложение (tests/api).
      - name: API-тесты на Postgres 18
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:api

      # API-тесты уже прошли предыдущим шагом, поэтому их проект здесь пропускаем.
      - name: Vitest на Postgres 18
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --project '!@studhub/tests-api'

      # Собирает SPA, поднимает API и vite preview на свободных портах и гоняет Playwright (tests/e2e).
      - name: E2E в Playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:e2e

  # Образ (Dockerfile) собирается на каждый PR, чтобы поломка сборки была видна до слияния.
  # Публикация в GHCR с тегом SHA идёт только по push в main. Реестр принимает образ по GITHUB_TOKEN, отдельного секрета нет.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Вход в GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка образа
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/nekomant/studhub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Выкладка в prod: только по слиянию в main и только когда зелёные checks и сборка образа.
  # Скрипт infra/deploy.sh делает migrate, pull, up -d и проверку /healthz. Если проверка не прошла, job красный.
  # Секреты (Settings > Secrets and variables > Actions): DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS.
  deploy:
    name: deploy
    needs: [checks, image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # 30 минут: сервер в РФ качает образ из GHCR медленно, первый деплой SH-011 не уложился в 10 минут.
    timeout-minutes: 30
    # Две выкладки подряд не идут одновременно, и новая не отменяет ту, что уже идёт.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5

      # Отпечаток сервера берётся из секрета DEPLOY_KNOWN_HOSTS: подмена сервера не пройдёт проверку.
      - name: Ключ SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Файлы infra лежат в репозитории: сервер всегда выкладывает ту версию compose и Caddyfile, что в этом коммите.
      - name: Файлы infra на сервер
        run: >-
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          infra/docker-compose.prod.yml infra/Caddyfile infra/deploy.sh "$DEPLOY_TARGET":/srv/studhub/

      - name: Выкладка образа
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_TARGET"
          "cd /srv/studhub && chmod +x deploy.sh && ./deploy.sh ${{ github.sha }}"
